services:
  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    container_name: forgeflow-rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: forgeflow
      RABBITMQ_DEFAULT_PASS: forgeflow
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  postgres:
    image: postgres:16-alpine
    container_name: forgeflow-postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: forgeflow
      POSTGRES_USER: forgeflow
      POSTGRES_PASSWORD: forgeflow
    volumes:
      - forgeflow-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U forgeflow -d forgeflow"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: forgeflow-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  workflow-service:
    build:
      context: .
      dockerfile: workflow-service/Dockerfile
    container_name: forgeflow-workflow-service
    ports:
      - "8080:8080"
    environment:
      RABBITMQ_HOST: rabbitmq
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/forgeflow
      SPRING_DATASOURCE_USERNAME: forgeflow
      SPRING_DATASOURCE_PASSWORD: forgeflow
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      REDIS_HOST: redis
    depends_on:
      rabbitmq:
        condition: service_healthy
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 60s

  execution-worker:
    build:
      context: .
      dockerfile: execution-worker/Dockerfile
    container_name: forgeflow-execution-worker
    environment:
      RABBITMQ_HOST: rabbitmq
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/forgeflow
      SPRING_DATASOURCE_USERNAME: forgeflow
      SPRING_DATASOURCE_PASSWORD: forgeflow
    depends_on:
      rabbitmq:
        condition: service_healthy
      postgres:
        condition: service_healthy
      workflow-service:
        condition: service_healthy
    restart: on-failure

volumes:
  forgeflow-postgres-data:
